spring.application.name=ItineraryService
spring.datasource.url=jdbc:postgresql://localhost:5432/tpItinerary
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8081
server.servlet.session.cookie.same-site=strict
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.instance.prefer-ip-address=true
eureka.instance.hostname=host.docker.internal
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${server.port}

# Kafka Broker Address
spring.kafka.bootstrap-servers=localhost:9092

# Serializer: How to turn your Java Object into bytes for the network
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Optional: Ensure the topic is created automatically if it doesn't exist
spring.kafka.admin.auto-create=true

# Consumer
spring.kafka.consumer.group-id=tp-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer